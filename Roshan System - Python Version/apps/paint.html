<!DOCTYPE html>
<head>
    <meta charset="UTF-8"/>
    <title>Pain(t)</title>
    <style>
        html, body {
            background-color: rgba(30, 30, 30, 0.8);
        }
        input {
            border: none;
            color: white;
            background-color: rgb(30, 30, 30);
            padding: 8px 16px;
            border-radius: 10px;
        }
        .app-container {
            display: flex;
            gap: 10px;
        }
        .color-panel {
            display: grid;
            grid-template-rows: 50px 50px;
            grid-template-columns: repeat(5, 50px);
            background-color: rgba(30, 30, 30, 0.8);
            border: 2px solid white;
            width: 800px;
            height: 100px;
        }
        canvas {
            border: 5px solid black;
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="app-container">
        <input id="color-input" placeholder="Enter a hex code for the color you want"/>
        <div id="color-panel">
            <button style="background-color: red; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('red')"></button>
            <button style="background-color: orange; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('orange')"></button>
            <button style="background-color: yellow; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('yellow')"></button>
            <button style="background-color: green; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('green')"></button>
            <button style="background-color: blue; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('blue')"></button>
            <button style="background-color: black; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('black')"></button>
            <button style="background-color: gray; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('gray')"></button>
            <button style="background-color: lightblue; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('lightblue')"></button>
            <button style="background-color: purple; width: 50px; height: 50px; border-radius: 10px; border: none" onclick="changeColor('purple')"></button>

        </div>
        <canvas id="PaintCanvas" width="800" height="400"/>
    </div>
    <script>
    const canvas = document.getElementById("PaintCanvas");
    const ctx = canvas.getContext("2d");
    const colorInput = document.getElementById("color-input");

    let isDrawing = false;
    let color = "black";

    function draw(x, y) {
      ctx.beginPath();
      const radius = 10;
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function changeColor(newColor) {
      color = newColor
    }

    colorInput.addEventListener("keydown", function(event) {
      if (event.key == "Enter") {
        color = this.value
      }
    });
    canvas.addEventListener("mousedown", (event) => {
      isDrawing = true;
      draw(event.offsetX, event.offsetY)
    });
    canvas.addEventListener("mousemove", (event) => {
      if (isDrawing) draw(event.offsetX, event.offsetY);
    });
    window.addEventListener("mouseup", () => isDrawing = false);
    </script>
</body>
