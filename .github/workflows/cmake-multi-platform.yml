# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Compile Roshan OS

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Ninja for windows
      if: matrix.os == 'windows-latest'
      run: |
        python -m pip install ninja

    - name: Install Qt
      if: matrix.os != 'windows-latest'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9'
        target: 'desktop'
        modules: 'qtwebengine'

    - name: Install Qt for Windows
      if: matrix.os == 'windows-latest'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtwebengine'

    - name: Install Dependencies for Windows
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install boost-headers boost-dll nlohmann-json

    - name: Install Dependencies for Mac
      if: matrix.os == 'macos-latest'
      run: |
        brew install boost nlohmann-json

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      if: matrix.os != 'windows-latest'
      run: |
        cd 'Roshan System - C++ Version'
        mkdir build
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake for Windows
      if: matrix.os == 'windows-latest'
      run: |
        cd 'Roshan System - C++ Version'
        mkdir build
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake'

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: |
        cd 'Roshan System - C++ Version'
        cmake --build build --config Release
    - name: Deploy App for Windows
      if: matrix.os == 'windows-latest'
      run: |
        cd 'Roshan System - C++ Version/build/Release'
        windeployqt RoshanSystem.exe
    - name: Deploy App for Mac
      if: matrix.os == 'macos-latest'
      run: |
        cd 'Roshan System - C++ Version/build'
        macdeployqt RoshanSystem.app
     
    - name: Upload Built version
      uses: actions/upload-artifact@v4
      with:
        name: RoshanSystem-Package
        path: |
          Roshan System - C++ Version/build/
          Roshan System - C++ Version/build/Release/
          !Roshan System - C++ Version/build/**/*.obj
          !Roshan System - C++ Version/build/**/*.o
          !Roshan System - C++ Version/build/**/*.tlog
          !Roshan System - C++ Version/build/**/CMakeFiles/
          !Roshan System - C++ Version/build/**/CMakeCache.txt
